# Promtail scrape config for ignitenet-proxy logs -> Loki.
# The service logs to stdout, captured by systemd/journald. Merge this scrape
# job into your Promtail config and point `clients` at your Loki instance.

clients:
  - url: http://<loki-host>:3100/loki/api/v1/push

scrape_configs:
  - job_name: ignitenet-proxy
    journal:
      path: /var/log/journal
      max_age: 12h
      labels:
        job: ignitenet-proxy
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        regex: 'ignitenet-proxy\.service'
        action: keep
      - source_labels: ['__journal__systemd_unit']
        target_label: unit
      - source_labels: ['__journal_priority_keyword']
        target_label: level
